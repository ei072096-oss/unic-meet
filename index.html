<style>:root{--bg:#FFF8F1;--card:#FFFFFF;--ink:#2B2430;--sub:#6F6577;--line:#EFE3D8;--pink:#FF5C86;--line-green:#06C755;color-scheme:light dark}

:root[data-theme="dark"]{--bg:#1B1720;--card:#26212D;--ink:#F6F0F7;--sub:#B9AFC2;--line:#3B3345}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:18px 16px 56px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.logo{display:block;width:210px;margin:6px auto 0;border-radius:14px}
.hero{text-align:center;padding-top:6px}
.hero .catch{font-size:26px;font-weight:900;letter-spacing:.04em;margin:14px 0 6px;line-height:1.35}
.hero .lead{color:var(--sub);font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:20px 0 6px}
.thumbs div{aspect-ratio:1/1.15;border-radius:14px;overflow:hidden;background:var(--c)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.meta span{font-size:12px;border:1.5px solid var(--line);border-radius:99px;padding:3px 11px;background:var(--card)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:16px;text-align:center;text-decoration:none;background:var(--pink);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.line{background:var(--line-green)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:10px 14px;font-size:14px}
.btn+.btn{margin-top:12px}
.note{font-size:12px;color:var(--sub);margin-top:16px}
.prog{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 8px}
.prog i{display:block;height:100%;background:var(--pink);border-radius:9px;transition:width .25s}
.qn{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.qtext{font-size:21px;font-weight:800;line-height:1.6;margin:30px 2px 26px;min-height:8.5em}
.ans{display:grid;gap:10px}
.ans button{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700;font-size:15px;display:flex;align-items:center;gap:12px;transition:border-color .1s,background .1s}
.ans button b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);font-size:13px}
.ans button.on{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,var(--card))}
.ans button.on b{background:var(--pink);color:#fff}
.back{background:none;border:0;color:var(--sub);font-size:14px;margin-top:18px;padding:8px 0}
.form{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
.form label{display:block;font-weight:800;font-size:14px;margin:0 0 6px}
.form input[type=date],.form input[type=time]{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.form .row{margin-bottom:16px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px}
.center{text-align:center}
.spin{font-size:56px;margin:80px 0 12px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.prog i{transition:none}}

/* result */
.res-hero{border-radius:28px;background:color-mix(in srgb,var(--c) 26%,var(--card));padding:22px 18px 20px;text-align:center;border:2px solid color-mix(in srgb,var(--c) 55%,var(--card))}
.res-hero .no{font-size:13px;font-weight:800;color:var(--sub)}

.res-hero .pic img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.res-hero .you{font-size:15px;font-weight:700;margin-top:8px}
.res-hero h1{font-size:30px;font-weight:900;line-height:1.35;margin:2px 0 4px}
.kind{display:inline-block;background:var(--c);color:#2B2430;font-weight:800;font-size:13px;border-radius:99px;padding:3px 14px}

.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tags span{font-size:12px;font-weight:700;background:var(--card);border-radius:99px;padding:2px 10px}
.sub-type{font-size:12px;color:var(--sub);margin-top:12px}
.sec{margin-top:30px}
.sec h2{font-size:19px;font-weight:900;margin-bottom:10px;padding-left:12px;border-left:6px solid var(--c,var(--pink));line-height:1.4}
.sec p{font-size:15px}
.sec p+p{margin-top:8px}
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 16px}
.box+.box{margin-top:12px}
.box h3{font-size:14px;font-weight:800;margin-bottom:4px;color:var(--sub)}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{position:relative;padding-left:22px;font-size:15px}
.list li::before{content:"";position:absolute;left:3px;top:.62em;width:10px;height:10px;border-radius:50%;background:var(--c,var(--pink))}
.axis{display:grid;grid-template-columns:3.2em 1fr 3.2em;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:14px 0 2px}
.axis .r{text-align:right}
.bar{position:relative;height:12px;border-radius:9px;background:var(--line)}
.bar i{position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 2px var(--c);transform:translateX(-50%)}
.axis-note{font-size:13px;color:var(--sub)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.pillars div{background:var(--bg);border-radius:14px;padding:8px 2px;border:2px solid var(--line)}
.pillars small{display:block;font-size:11px;color:var(--sub)}
.pillars b{font-size:24px;letter-spacing:.06em;font-weight:900}
.pillars .day{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.el{display:grid;grid-template-columns:2em 1fr 3em;gap:8px;align-items:center;font-size:13px;font-weight:800;margin:6px 0}
.el .b{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.el .b i{display:block;height:100%;border-radius:9px}
.gap{border-left:5px solid #FFB020;border-radius:6px 16px 16px 6px;background:color-mix(in srgb,#FFB020 12%,var(--card));padding:12px 14px;font-size:15px}
.gap+.gap{margin-top:10px}
.gap b{display:block;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.mini{display:flex;gap:10px;align-items:center;margin:8px 0}
.mini img{width:46px;height:46px;border-radius:14px;object-fit:cover;object-position:50% 20%;flex:none}
.mini div{font-size:14px;line-height:1.5}

.action{border-radius:24px;padding:20px 18px;background:color-mix(in srgb,var(--ac) 20%,var(--card));border:2px solid color-mix(in srgb,var(--ac) 60%,var(--card))}

.steps{counter-reset:s;margin:0;padding:0;list-style:none;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;font-size:15px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900}
.svc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.svc b{font-size:16px}
.svc p{font-size:14px;color:var(--sub)}
.soft{font-size:13px;color:var(--sub);margin-top:10px}
.stars{letter-spacing:.08em;color:#FFB020;font-size:15px}
.cmp{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;font-size:14px;margin:10px 0}
.cmp span:nth-child(odd){font-weight:800}
.ptable{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.ptable button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:4px 0 6px;font-size:11px;font-weight:800;display:grid;justify-items:center;gap:2px}

.foot{margin-top:34px;font-size:12px;color:var(--sub);text-align:center}
/* Individually redrawn high-resolution characters; never crop the ears/face. */
.thumbs img,.pic img,.mini img,.ptable img{object-fit:contain;object-position:center;aspect-ratio:1/1}
.thumbs div{aspect-ratio:1/1}
.form input{max-width:100%;min-width:0}
.form input:disabled{opacity:.5}
.animal{position:relative;display:block;padding-bottom:0;width:100%;height:100%;overflow:hidden}

.mini .animal{width:56px;height:56px;flex:none}
.ptable .animal{width:58px;height:58px;max-width:100%}
.thumbs>div{aspect-ratio:1/1}
button:disabled{opacity:.55;cursor:default;box-shadow:none}
.ans button,.btn{min-height:48px}

.form select,.form input[type=text]{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:6px}

.service-description{font-size:14px!important;color:var(--sub);line-height:1.9}.service-price{font-size:35px;font-weight:700;letter-spacing:.02em;margin-top:24px}.service-price span{font-size:12px;font-weight:500;margin-left:5px}.service-spec{font-size:12px!important;color:var(--sub);margin:0 0 18px!important}

.consult-card{padding:28px 22px;background:#f1e9e2;color:#352f2b;border-radius:24px}.consult-card h3{font-size:23px;margin:14px 0 18px;line-height:1.6}.consult-card p{line-height:1.9}.consult-card .btn{background:#38332f;color:#fff;box-shadow:none;margin-top:22px;font-size:14px}
.calendar-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px}.birth-pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:20px 0}.birth-pillars>div{text-align:center;background:var(--bg);padding:13px 2px;border-radius:12px}.birth-pillars small{display:block;font-size:11px;color:var(--sub)}.birth-pillars strong{display:block;font-size:19px;line-height:1.4;overflow-wrap:anywhere;margin-top:6px}.stem-reading{display:flex;gap:15px;align-items:center;border-top:1px solid var(--line);padding:22px 0 16px}.stem-sign{font-family:serif;font-size:48px;color:#ab806c}.stem-reading h3{font-size:15px;line-height:1.8}.calendar-details{font-size:12px;border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.calendar-details summary{cursor:pointer;color:var(--sub)}.calendar-details p{font-size:12px!important;line-height:1.9;margin-top:10px}.boundary-note{font-size:12px!important;background:var(--bg);border-radius:10px;padding:12px}
.action{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px}.action h3{font-size:21px;line-height:1.6;margin-bottom:12px}.action p{font-size:14px;line-height:1.9;color:var(--sub)}
.line-steps{padding-left:22px;margin:22px 0 16px;display:grid;gap:10px;font-size:13px;line-height:1.9}.unic-about{border-top:1px solid var(--line);padding-top:28px}.unic-about h2{border:0;padding:0;font-size:22px;margin:12px 0}.unic-about>p:not(.eyebrow){font-size:14px;color:var(--sub);line-height:1.95}
#story-output img{display:block;width:100%;max-width:270px;height:auto;margin:16px auto;border-radius:16px}
.consult-card .cta-sub{display:block;font-size:12px;font-weight:500;letter-spacing:.03em;margin-top:5px}
</style></head>

// 回答(1-5)→各項目0-100（逆転項目は反転、重み付き平均）
function calcD(ans){
  const sum={},w={};
  Q.forEach((q,i)=>{
    if(!TYPE_ORDER.includes(i)||!Number.isInteger(ans[i])||ans[i]<1||ans[i]>5) return;
    let s=(ans[i]-1)/4*100; if(q.r) s=100-s;
    sum[q.d]=(sum[q.d]||0)+s*q.w; w[q.d]=(w[q.d]||0)+q.w;
  });
  const D=Object.fromEntries(Q.map(q=>[q.d,50])); Object.keys(sum).forEach(k=>D[k]=Math.round(sum[k]/w[k]));
  return D;
}

const TH=55, PRIO=['KNOW','LOVE','SERIOUS','MORE'];
function pickActions(S){
  const list=PRIO.map(k=>({k,v:S[k]})).filter(x=>x.v>=TH)
    .sort((a,b)=>Math.abs(a.v-b.v)<3?PRIO.indexOf(a.k)-PRIO.indexOf(b.k):b.v-a.v);
  if(!list.length) return {primary:'OK',second:null};
  const p=list[0]; let s=list.find((x,i)=>i>0&&p.v-x.v<=25)||null;
  if(p.k==='SERIOUS'&&s&&s.k==='MORE') s=null; // 結婚相談所で出会いも確保できるため重複提案しない
  return {primary:p.k,second:s?s.k:null};
}

// 相性（12×12）：自分の実スコア vs 相手タイプのプロトタイプ。総合％は出さず、5観点で表示
const CATS=['talk','affect','dist','speed','values'];
function compat(u,j){
  const p=T[j].p,d=k=>Math.abs(u[IDX[k]]-p[IDX[k]]);
  const raw={
    talk:100-(d('EI')*.3+d('NS')*.35+d('FT')*.35)*1.1,
    affect:100-(d('exp')*.5+d('FT')*.3+d('sec')*.2)*1.1,
    dist:100-(d('ind')*.5+d('sec')*.5)*1.1,
    speed:100-(d('spd')*.6+d('act')*.2+d('cau')*.2)*1.1,
    values:100-(d('ide')*.25+d('rea')*.25+d('one')*.25+d('PJ')*.25)*1.1};
  const stars={};CATS.forEach(k=>{const v=raw[k];stars[k]=v>=85?5:v>=72?4:v>=58?3:v>=45?2:1;});
  const spread=(d('act')+d('ind')+d('EI')+d('NS')+d('FT'))/5;
  const n4=CATS.filter(k=>stars[k]>=4).length;
  const label=n4>=3?'似た者同士で、安心しやすい関係':(spread>=24&&stars.values>=3&&stars.dist>=3)?'違いを補い合える関係':'刺激と学びが多い関係';
  const order=['dist','speed','talk','affect','values'];
  const low=order.reduce((a,b)=>stars[b]<stars[a]?b:a);
  return {raw,stars,spread,label,low,j};
}
function topMatches(u){
  const all=T.map((_,j)=>compat(u,j));
  const talk=[...all].sort((a,b)=>b.raw.talk-a.raw.talk).slice(0,2);
  const val=[...all].sort((a,b)=>b.raw.values-a.raw.values).slice(0,2);
  let comp=all.filter(x=>x.spread>=22).sort((a,b)=>(b.raw.values+b.raw.dist)-(a.raw.values+a.raw.dist));
  if(!comp.length) comp=[...all].sort((a,b)=>b.spread-a.spread);
  return {talk,val,comp:comp.slice(0,2)};
}

 return sec('自分の恋愛タイプを、もっと詳しく知りたい方へ',`<div class="consult-card"><p class="eyebrow">YOUR TYPE, YOUR MARRIAGE JOURNEY</p><h3>Zoom無料診断で、<br>これからの婚活を一緒に。</h3><p>${t?`「${esc(t.nm)}」という結果をヒントに、`:''}自分の恋愛タイプや、婚活で大切にしたいことを、もう少し深く知ってみませんか。</p><p>Zoomでの無料診断では、婚活のプロと一緒に診断結果を振り返り、今のお悩みや希望を整理します。あなたに合う今後の婚活方法を、一緒に考えます。</p>${url?`<a class="btn" data-role="zoom-consult" href="${esc(url)}" target="_blank" rel="noopener">「私の婚活、何から始める？」を見つける<span class="cta-sub">Zoom無料診断</span></a>`:'<button class="btn" data-role="zoom-consult" disabled>「私の婚活、何から始める？」を見つける<span class="cta-sub">Zoom無料診断</span></button><p class="soft">無料診断の受付リンクは準備中です。</p>'}<ol class="line-steps"><li>${booking?'予約ページから、希望の日程を選ぶ':'公式LINEで「無料診断希望」とひとこと送る'}</li><li>担当者とZoomの日程を調整する</li><li>Zoomで婚活のプロと、これからの進め方を考える</li></ol><p class="soft">もしよければ、診断で出た動物タイプも${line?'LINEで送ってください':'教えてください'}。覚えていなくても、結果が手元になくても大丈夫です。今のお悩みからお話しいただけます。</p>${!booking?'<p class="soft">公式LINEに登録済みの方は再登録不要です。</p>':''}<p class="soft">診断結果は登録せずにすべて閲覧できます。生年月日・出生時刻・回答は予約フォームやLINEへ自動送信しません。</p></div>`);
}
function compatPanel(u,j){
  const c=compat(u,j),t=T[j],C=CONF[c.low];
  return `<div class="mini" style="margin-top:12px">${im(t.id)}<div><b>${t.e} ${t.nm}</b><small>${c.label}</small></div></div>
  <div class="cmp">${CATS.map(k=>`<span>${CONF[k].n}</span><span class="stars">${stars(c.stars[k])}</span>`).join('')}</div>
  <div class="gap"><b>衝突しやすいポイント：${C.n}</b>${C.c}</div>
  <p style="margin-top:8px"><b>長期的に意識したいこと：</b>${C.l}</p>`;
}
function matchList(arr,cap){
  return `<div class="box"><h3>${cap}</h3>${arr.map(m=>{const t=T[m.j];return `<div class="mini">${im(t.id)}<div><b>${t.e} ${t.nm}</b><small>${m.label}</small></div></div>`;}).join('')}</div>`;
}
function resultHTML(){
  const r=st.res,t=T[r.type.n],D=r.D,c=t.c,u=r.u,sh=r.sh,M=r.M,sub=T[r.sub.n];
  let h=`<div class="res-hero" style="--c:${c}"><div class="no">LOVE TYPE ${t.id}</div><div class="pic">${im(t.id,'240px')||`<div style="font-size:90px;line-height:210px">${t.e}</div>`}</div>
  <div class="you">あなたは</div><h1>${t.e} ${t.nm}</h1><span class="kind">${t.kind}</span>
  <p class="cc">${t.catch}</p><div class="tags">${t.tags.map(x=>`<span>#${x}</span>`).join('')}</div>
  <p class="sub-type">あなたの中には「${sub.e} ${sub.nm}」の要素もあります</p></div>
  <p class="note">回答から見える傾向の参考情報です。10問での診断精度は未検証で、性格や相性を断定するものではありません。</p>`;
  h+=sec('LOVE TYPE 解説',`<p>${t.desc}</p><div class="box" style="margin-top:10px"><h3>付き合った後の特徴</h3><p>${t.after}</p><h3 style="margin-top:10px">相手からどう見られやすいか</h3><p>${t.seen}</p></div>`,c);
  h+=sec('あなたの恋愛の強み',`<div class="box">${ul(t.str)}</div>`,c);
  h+=sec('あなたの恋愛のクセ',`<div class="box">${ul(t.habit)}</div><div class="box"><h3>本人が気づきにくいクセ</h3><p>${t.unnoticed}</p></div>`,c);


  h+=sec('惹かれやすい相手',`<div class="box"><p>${t.attract}</p></div>`,c);
  h+=sec('長期的な関係を築きやすい相手',`<div class="box"><p>${t.long}</p></div><p class="soft">惹かれやすい相手と、長く安心できる相手は、必ずしも同じではありません。</p>`,c);
  h+=sec('恋愛・結婚で注意したいこと',`<div class="box"><h3>苦戦しやすい相手</h3><p>${t.hard}</p><h3 style="margin-top:10px">結婚生活で大切にすること</h3><p>${t.marry}</p><h3 style="margin-top:10px">婚活で気をつけるポイント</h3><p>${t.kon}</p></div><div class="box"><h3>おすすめの最初の一歩</h3><p>${t.act}</p></div>`,c);
  h+=sec('会話が合う人・違いを補い合える人',`<p class="soft">以下は動物タイプの一般的な特徴を比較した参考情報です。今回質問していないコミュニケーションの軸を個別に測定したものではありません。</p>`+matchList(M.talk,'話が合いやすいタイプ')+matchList(M.val,'価値観が近いタイプ')+matchList(M.comp,'自分と違うけれど、補い合いやすいタイプ')+`<p class="soft">相性は点数で決まるものではありません。「違い」は、知っていれば魅力にもなります。</p>`,c);
  h+=sec('気になるタイプとの相性をチェック',`<div class="ptable" id="pt">${T.map((x,j)=>`<button data-a="pick" data-j="${j}">${im(x.id)}<span>${AN[j]}</span></button>`).join('')}</div><div id="cmp"><p class="soft">タイプを選ぶと、会話・愛情表現・距離感・スピード・価値観を比べられます。</p></div>`,c);
  h+=shichuHTML(sh,c);
  h+=actionHTML(r);
  h+=consultationHTML();
  h+=sec('診断結果をシェアする',`<a class="btn line" target="_blank" rel="noopener" href="${lineHref(resText(t))}">LINEで友だちに結果を送る</a><a class="btn ghost small" target="_blank" rel="noopener" href="${lineHref(toolText())}">診断そのものを友だちに送る</a><p class="soft">送る相手はLINEの画面で選べます。生年月日や個別の回答は共有しません。</p><button class="btn" data-a="instagram">Instagramでシェア</button><p class="soft">ストーリーズ用画像を作成します。Instagramへ自動投稿はしません。</p><div id="story-output" aria-live="polite"></div>`);
  h+=serviceLink();
  h+=`<button class="btn ghost small" style="margin-top:24px" data-a="retry">もう一度診断する</button><p class="foot">unic MEET ／ あなたの婚活、どんなタイプ？<br>※本診断は心理検査・医学的診断ではなく、自己理解のためのエンターテインメントです。</p>`;
  return h;
}

function compute(){
  const D=calcD(st.ans), u=featOf(D), sh=calcShichu(st.birth);
  const rank=matchType(u.map(v=>clamp(50+(v-50)*1.2,0,100)),null); // 5段階回答は中央に寄りやすいため1.2倍に伸ばして照合
  const S=calcActions(D), pk=pickActions(S);
  return {D,u:T[rank[0].n].p,sh,type:rank[0],sub:rank[1],scores:S,primary:pk.primary,second:pk.second,recommendation:recommendation(st.ans),gaps:[],M:topMatches(T[rank[0].n].p)};
}
function render(){
  const a=app(); let h='';
  if(st.screen==='intro') h=intro();
  else if(st.screen==='quiz') h=quiz();
  else if(st.screen==='birth') h=birthForm();
  else if(st.screen==='loading') h=loading();
  else if(st.screen==='shared') h=sharedHTML();
  else h=resultHTML();
  a.innerHTML=h;
  try{window.scrollTo(0,0);}catch(e){}
}
function finish(){
  st.screen='loading';render();
  setTimeout(()=>{st.res=compute();st.screen='result';render();},1400);
}
function onClick(e){
  const b=e.target.closest('button,a'); if(!b) return;
  if(b.dataset.s){
    if(lock) return; lock=true;
    const qi=ORDER[st.pos]; st.ans[qi]=+b.dataset.s;
    [...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));
    setTimeout(()=>{ lock=false; if(st.pos<ORDER.length-1){st.pos++;render();} else {finish();} },170);
    return;
  }
  const a=b.dataset.a; if(!a) return;
  if(a==='start'){history.replaceState(null,'',baseUrl());st.screen='birth';st.pos=0;st.ans=[];st.res=null;render();}
  else if(a==='back'){if(st.pos>0){st.pos--;render();}}
  else if(a==='go'){
    const d=document.getElementById('bd').value, tm=document.getElementById('bt').value, nt=document.getElementById('bn').checked;
    const error=validateBirth(d);document.getElementById('birth-error').textContent=error;document.getElementById('bd').setAttribute('aria-invalid',String(!!error));if(error){document.getElementById('bd').focus();return;}
    if(!nt&&tm&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(tm)){document.getElementById('birth-error').textContent='出生時刻をご確認ください。';return;}
    const zone=document.getElementById('bz').value==='other'?document.getElementById('bz-other').value.trim():document.getElementById('bz').value;
    const birth={date:d,time:nt?'':tm,noTime:nt||!tm,zone};try{calcShichu(birth);}catch(err){document.getElementById('birth-error').textContent=err instanceof RangeError?'出生地のタイムゾーンをご確認ください。':err.message;return;}st.birth=birth;st.screen='quiz';render();
  }
  else if(a==='addbirth'){st.screen='birth';render();}
  else if(a==='retry'){history.replaceState(null,'',baseUrl());st.screen='intro';st.pos=0;st.ans=[];st.birth=null;st.res=null;render();}
  else if(a==='copytool') copy(toolText());
  else if(a==='instagram') makeStory().catch(()=>toast('画像を作成できませんでした。もう一度お試しください。'));
  else if(a==='pick'){
    const j=+b.dataset.j;
    document.querySelectorAll('#pt button').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('cmp').innerHTML=compatPanel(st.res.u,j);
  }
}

function serviceLink(){return `<section class="sec unic-about"><p class="eyebrow">ABOUT UNIC MEET</p><h2>あなたらしい婚活を、unic MEETと。</h2><p>unic MEETは、婚活の悩みや「これからどう進めたい？」に向き合うきっかけを届けます。婚活を支えるサービスの内容は、サービス紹介ページでご覧いただけます。</p><a class="btn ghost small" style="margin-top:18px" href="https://quiet-pasca-d4a0c0.netlify.app/" target="_blank" rel="noopener">unicのサービスを詳しく見る</a></section>`;}
function parseShared(search){
  const p=new URLSearchParams(search);if(!p.has('type')&&!p.has('sub'))return null;
  if(p.getAll('type').length!==1||p.getAll('sub').length!==1)return {invalid:true};
  const type=T.findIndex(t=>t.id===p.get('type')),sub=T.findIndex(t=>t.id===p.get('sub'));
  return type<0||sub<0||type===sub?{invalid:true}:{type,sub};
}
function sharedHTML(){
  const r=st.shared;
  if(r.invalid)return `<h1>共有リンクを確認してください</h1><p>タイプIDが不正、または未対応です。ご自身の診断を始められます。</p><button class="btn" data-a="start">自分も診断する</button>`;
  const t=T[r.type],sub=T[r.sub];
  return `<p class="note">共有された結果です。あなた自身を診断した結果ではありません。</p><div class="res-hero" style="--c:${t.c}"><div class="pic">${im(t.id,'240px')}</div><h1>${t.e} ${t.nm}</h1><p>${t.catch}</p><p class="sub-type">サブタイプ：${sub.e} ${sub.nm}</p></div>`+
  sec('LOVE TYPE 解説',`<p>${t.desc}</p><p>${t.after}</p>`)+sec('恋愛の強み',ul(t.str))+sec('恋愛のクセ・注意点',ul(t.habit)+`<p>${t.unnoticed}</p><p>${t.hard}</p>`)+sec('相性のヒント',`<p>${t.long}</p><p>${t.marry}</p>`)+sec('サブタイプの解説',`<h3>${sub.nm}</h3><p>${sub.desc}</p>`)+
  `<p class="note">タイプ別の一般的な解説です。送信者の生年月日・回答・個人的な鑑定やおすすめは共有していません。</p><button class="btn" style="margin-top:20px" data-a="start">自分も診断する</button>`+serviceLink();
}

if(typeof document!=='undefined'&&document.getElementById('app')){
  st.shared=parseShared(location.search);if(st.shared)st.screen='shared';
  document.addEventListener('change',e=>{if(e.target.id==='bz'){document.getElementById('bz-other').style.display=e.target.value==='other'?'block':'none';}if(e.target.id==='bn'){const t=document.getElementById('bt');t.disabled=e.target.checked;if(t.disabled)t.value='';}});
  document.addEventListener('click',onClick);
  render();
}
